model:
  base_learning_rate: 1.0e-04
  target: models.KITTI_geo_ldm.txt_control.Boost_Sat2Den_ddpm
  params:
    AE_config:
      target: models.autoencoder.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: models.loss_fun.LPIPSWithDiscriminator
          params:
            disc_start: 50001
            kl_weight: 0.000001
            disc_weight: 0.5
    AE_ckpt_path: ./ckpt/sd-v1-4.ckpt
    DDPM_config:
        target: models.KITTI_geo_ldm_diffusion.latent_diffusion.DDPM
        params:
            linear_start: 0.00085
            linear_end: 0.012
            timesteps: 1000
            unet_config:
              target: models.KITTI_geo_ldm_diffusion.openaimodel.UNetModel
              params:
                image_size: 32
                in_channels: 4
                out_channels: 4
                model_channels: 320
                attention_resolutions:
                - 4
                - 2
                - 1
                num_res_blocks: 2
                channel_mult:
                - 1
                - 2
                - 4
                - 4
                num_heads: 8
                use_spatial_transformer: true
                transformer_depth: 1
                context_dim: 768
                use_checkpoint: false
                legacy: False
            control_grd:
              target: models.KITTI_geo_ldm.lidar_condition_model.LidarMultiScaleControl
              params:
                in_channels: 4
                model_channels: 320
                channel_mult:
                - 1
                - 2
                - 4
                - 4
                num_res_blocks: 2
                hidden_channels: 128
                middle_channels: 1280
                control_scale: 1.0
                semantic_class_count: 0
                semantic_class_scale: 1.0
                gate_channel: -1
                gate_residuals: false
    Condition_config_grd:
        target: ldm.modules.encoders.modules.CLIPVisionEmbedder
    Condition_config_sat:
        target: models.KITTI_geo_ldm.condition_model.VIT_224
    pre_sat2grd_model_path:
    pre_ldm_model_path: ./ckpt/sd-v1-4.ckpt
    scale_factor: 0.18215
    Condition_config_txt:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder
    use_lidar_cond: true
    lidar_condition_key: lidar_cond
    freeze_for_lidar_control: true
    dynamic_loss_weight: 0.0
    dynamic_x0_loss_weight: 0.0
    dynamic_point_loss_weight: 0.0
    dynamic_point_x0_loss_weight: 0.0
    static_teacher_consistency_weight: 0.0
    static_teacher_gate_channel: -1

data:
  target: dataloader.dataload.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 4
    wrap: True
    train:
      target: dataloader.KITTI_raw_sat_lidar.SatLidarRawDataset
      params:
        manifest: dataset/kitti_raw_sat_lidar/train_manifest.jsonl
        condition_mode: raw_lidar
        image_height: 128
        image_width: 512
        sat_size: 256
        max_depth: 80.0
        align_satellite_to_camera: true
    test:
      target: dataloader.KITTI_raw_sat_lidar.SatLidarRawDatasetTest
      params:
        manifest: dataset/kitti_raw_sat_lidar/val_manifest.jsonl
        condition_mode: raw_lidar
        image_height: 128
        image_width: 512
        sat_size: 256
        max_depth: 80.0
        align_satellite_to_camera: true

lightning:
  callbacks:
    image_logger:
      target: utils.callback.callback.ImageLogger
      params:
        batch_frequency: 500
        max_images: 4
  trainer:
    benchmark: True
    accumulate_grad_batches: 4
