&gt;&lt;b&gt;x' = x_base + \u0394ray&lt;/b&gt;\" style=\"rounded=0;whiteSpace=wrap;html=1;fillColor=#E8EDF2;strokeColor=#4A6072;strokeWidth=2;fontSize=15;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"1280\" y=\"290\" width=\"180\" height=\"82\" as=\"geometry\" />\n        </mxCell>\n        <mxCell id=\"note\" value=\"The module is repeated in the UNet transformer blocks. No decoder feedback, ControlNet residual, or scalar LiDAR gate is used.\" style=\"text;html=1;align=center;verticalAlign=middle;fontSize=12;fontColor=#6B7280;spacing=0;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"420\" y=\"590\" width=\"760\" height=\"28\" as=\"geometry\" />\n        </mxCell>\n\n        <mxCell id=\"e_sat_context\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#2D7F5E;strokeWidth=2;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"sat_context\" target=\"sat_cross\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_sat_delta\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#2D7F5E;strokeWidth=2;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"sat_cross\" target=\"sat_delta\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_xt\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#4A6072;strokeWidth=2;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"xt\" target=\"self_attn\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_query\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#4A6072;strokeWidth=2;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"self_attn\" target=\"query\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_lidar_tokens\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#C6682F;strokeWidth=2;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"lidar_tokens\" target=\"lidar_cross\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_lidar_delta\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#B9562E;strokeWidth=2;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"lidar_cross\" target=\"lidar_delta\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_q_sat\" value=\"same x_base query\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#4A6072;strokeWidth=1.5;dashed=1;endArrow=open;endFill=0;fontSize=10;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"self_attn\" target=\"sat_cross\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_q_lidar\" value=\"same x_base query\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#4A6072;strokeWidth=1.5;dashed=1;endArrow=open;endFill=0;fontSize=10;labelBackgroundColor=#FFFFFF;\" edge=\"1\" parent=\"1\" source=\"self_attn\" target=\"lidar_cross\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_sat_raea\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#2D7F5E;strokeWidth=2.5;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"sat_delta\" target=\"raea\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_query_raea\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#4A6072;strokeWidth=2.5;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"query\" target=\"raea\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_lidar_raea\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#B9562E;strokeWidth=2.5;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"lidar_delta\" target=\"raea\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_null_raea\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#7B8794;strokeWidth=2;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"null\" target=\"raea\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n        <mxCell id=\"e_raea_ffn\" style=\"edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#A57414;strokeWidth=3;endArrow=block;endFill=1;\" edge=\"1\" parent=\"1\" source=\"raea\" target=\"ffn\"><mxGeometry relative=\"1\" as=\"geometry\" /></mxCell>\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>\n";
const diagramTitle = "raea_fusion_detail.drawio";
const iframe = document.getElementById('drawio');
let loaded = false;
function downloadXml(savedXml) {
  const blob = new Blob([savedXml], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const cleanTitle = diagramTitle.endsWith('.drawio') ? diagramTitle : `${diagramTitle}.drawio`;
  link.href = url;
  link.download = cleanTitle;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function sendLoad() {
  iframe.contentWindow.postMessage(JSON.stringify({
    action: 'load',
    autosave: 0,
    modified: 0,
    title: diagramTitle,
    xml
  }), '*');
}
window.__drawioPreview = {
  requestSave: () => iframe.contentWindow.postMessage(JSON.stringify({ action: 'save' }), '*')
};
window.addEventListener('message', (evt) => {
  let msg = evt.data;
  try { if (typeof msg === 'string') msg = JSON.parse(msg); } catch (e) { return; }
  if (!msg) return;
  if (msg.event === 'save' && msg.xml) {
    downloadXml(msg.xml);
    iframe.contentWindow.postMessage(JSON.stringify({
      action: 'status',
      modified: false,
      message: 'Downloaded .drawio file'
    }), '*');
    return;
  }
  if (!loaded && (msg.event === 'init' || msg.event === 'configure')) {
    loaded = true;
    sendLoad();
  }
});
setTimeout(() => { if (!loaded) sendLoad(); }, 2500);
</script>
